<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map {
      height: 400px;
    }
    .text-overlay {
      background-color: rgba(0,128,255,.7);
      padding: 0px;
      font-weight: bold;
      font-size: medium;
      display: inline-block;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  // Create a Leaflet map
  var map = L.map('map').setView([40.7848927, -77.8685289], 13);

  // Add a base map layer (you can choose your own)
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  // Create a custom div icon with your text
  var textIcon = L.divIcon({
    className: 'text-overlay',
    html: 'ParkForest',
//    iconSize: [100, 40], // Adjust the size as needed
  });

  // Add the marker with the custom div icon
  L.marker( [40.799776, -77.907427], { icon: textIcon }).addTo(map);

  // Optional: Add more layers, controls, etc.

</script>
</body>
</html>
